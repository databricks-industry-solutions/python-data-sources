name: Test Python Data Sources

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed-submodules: ${{ steps.detect.outputs.changed-directories }}
      has-changes: ${{ steps.check.outputs.has-changes }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed directories
        id: detect
        uses: sankichi92/list-changed-directories@v1
        with:
          target-file: __init__.py
          common-dependency-paths: |-
            pyproject.toml
            src/python_data_sources/__init__.py
            .github/workflows/test.yml

      - name: Check if any submodules changed
        id: check
        run: |
          CHANGED='${{ steps.detect.outputs.changed-directories }}'
          echo "Changed directories: $CHANGED"
          
          # Check if any of our submodules are in the changed list
          HAS_MCAP=$(echo "$CHANGED" | jq 'map(select(contains("mcap"))) | length > 0')
          HAS_MQTT=$(echo "$CHANGED" | jq 'map(select(contains("mqtt"))) | length > 0')
          HAS_ZIPDCM=$(echo "$CHANGED" | jq 'map(select(contains("zipdcm"))) | length > 0')
          
          # Build the list of submodules to test
          SUBMODULES="[]"
          if [ "$HAS_MCAP" = "true" ]; then
            SUBMODULES=$(echo "$SUBMODULES" | jq '. + ["mcap"]')
          fi
          if [ "$HAS_MQTT" = "true" ]; then
            SUBMODULES=$(echo "$SUBMODULES" | jq '. + ["mqtt"]')
          fi
          if [ "$HAS_ZIPDCM" = "true" ]; then
            SUBMODULES=$(echo "$SUBMODULES" | jq '. + ["zipdcm"]')
          fi
          
          echo "Submodules to test: $SUBMODULES"
          echo "submodules=$SUBMODULES" >> $GITHUB_OUTPUT
          
          if [ "$SUBMODULES" = "[]" ]; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Output detected submodules
        run: |
          echo "Changed directories: ${{ steps.detect.outputs.changed-directories }}"
          echo "Submodules to test: ${{ steps.check.outputs.submodules }}"
          echo "Has changes: ${{ steps.check.outputs.has-changes }}"

  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        submodule: ${{ fromJSON(needs.detect-changes.outputs.changed-submodules) }}
        python-version: ['3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: |
          pip install --upgrade pip
          pip install hatch

      - name: Determine submodule from path
        id: submodule
        run: |
          # Extract the submodule name from the changed directory path
          DIR="${{ matrix.submodule }}"
          if [[ "$DIR" == *"mcap"* ]]; then
            echo "name=mcap" >> $GITHUB_OUTPUT
          elif [[ "$DIR" == *"mqtt"* ]]; then
            echo "name=mqtt" >> $GITHUB_OUTPUT
          elif [[ "$DIR" == *"zipdcm"* ]]; then
            echo "name=zipdcm" >> $GITHUB_OUTPUT
          else
            echo "name=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Run tests for ${{ steps.submodule.outputs.name }}
        if: steps.submodule.outputs.name != 'unknown'
        run: |
          echo "Running tests for ${{ steps.submodule.outputs.name }}"
          hatch run test-${{ steps.submodule.outputs.name }}:test

  test-all:
    needs: detect-changes
    if: |
      contains(needs.detect-changes.outputs.changed-submodules, 'src/python_data_sources') ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: |
          pip install --upgrade pip
          pip install hatch

      - name: Run all tests
        run: |
          # Run tests for each submodule
          echo "Running MCAP tests..."
          hatch run test-mcap:test || true
          
          echo "Running MQTT tests..."
          hatch run test-mqtt:test || true
          
          echo "Running ZipDCM tests..."
          hatch run test-zipdcm:test || true

  test-summary:
    needs: [detect-changes, test, test-all]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Check test results
        run: |
          echo "Test workflow completed"
          echo "Changes detected: ${{ needs.detect-changes.outputs.has-changes }}"
          
          if [ "${{ needs.test.result }}" = "failure" ] || [ "${{ needs.test-all.result }}" = "failure" ]; then
            echo "Some tests failed!"
            exit 1
          else
            echo "All tests passed!"
          fi
