name: Test Python Data Sources

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.11.2"

      - name: Initialize the project
        run: make dev

      - name: Format all files
        run: make fmt

      - name: Fail on differences
        run: git diff --exit-code

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      submodules: ${{ steps.check.outputs.submodules }}
      has-changes: ${{ steps.check.outputs.has-changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: List changed directories
        id: detect
        uses: sankichi92/list-changed-directories@1a7ce7073846c0f941d2d3dd7597974022907889
        with:
          target-file: __init__.py
          common-dependency-paths: |-
            pyproject.toml
            src/python_data_sources/__init__.py
            .github/workflows/test.yml

      - name: Check if any submodules changed
        id: check
        env:
          CHANGED_DIRECTORIES: ${{ steps.detect.outputs.changed-directories }}
        run: .github/scripts/detect_changed_submodules.sh

  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        submodule: ${{ fromJSON(needs.detect-changes.outputs.submodules) }}
        python-version: ['3.12']

    env:
      UV_PYTHON: "${{ matrix.python-version }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.11.2"

      - name: Initialize the project
        run: make dev

      - name: Run tests for ${{ matrix.submodule }}
        env:
          SUBMODULE: ${{ matrix.submodule }}
        run: make test-module MODULE="${SUBMODULE}"

  test-all:
    needs: detect-changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      UV_PYTHON: "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.11.2"

      - name: Initialize the project
        run: make dev

      - name: Run all tests
        run: make test

  test-summary:
    needs: [detect-changes, test, test-all]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check test results
        run: |
          echo "Test workflow completed"
          echo "Changes detected: ${{ needs.detect-changes.outputs.has-changes }}"
          echo "Submodules tested: ${{ needs.detect-changes.outputs.submodules }}"

          if [ "${{ needs.test.result }}" = "failure" ] || [ "${{ needs.test-all.result }}" = "failure" ]; then
            echo "Some tests failed!"
            exit 1
          else
            echo "All tests passed!"
          fi

  e2e:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest

    env:
      UV_PYTHON: "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.11.2"

      - name: Initialize the project
        run: make dev

      - name: Run e2e Tests
        run: make e2e
        env:
          REF_NAME: ${{ github.ref_name }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
