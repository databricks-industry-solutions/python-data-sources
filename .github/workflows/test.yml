name: Test Python Data Sources

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      submodules: ${{ steps.check.outputs.submodules }}
      has-changes: ${{ steps.check.outputs.has-changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed directories
        id: detect
        uses: sankichi92/list-changed-directories@v1
        with:
          target-file: __init__.py
          common-dependency-paths: |-
            pyproject.toml
            src/python_data_sources/__init__.py
            .github/workflows/test.yml

      - name: Check if any submodules changed
        id: check
        run: |
          CHANGED='${{ steps.detect.outputs.changed-directories }}'
          echo "Changed directories: $CHANGED"

          # Extract unique submodule names from paths like:
          # - src/python_data_sources/<submodule>
          # - tests/<submodule>
          SUBMODULES=$(echo "$CHANGED" | jq -r '
            [.[] |
              # Extract from src/python_data_sources/<submodule>
              (capture("src/python_data_sources/(?<name>[^/]+)") | .name),
              # Extract from tests/<submodule>
              (capture("tests/(?<name>[^/]+)") | .name)
            ] |
            # Remove nulls and get unique values
            map(select(. != null)) |
            unique |
            # Filter out common files (conftest, etc.)
            map(select(. != "conftest.py" and . != "__pycache__"))
          ')

          if [ -z "$SUBMODULES" ] || [ "$SUBMODULES" = "null" ] || [ "$SUBMODULES" = "[]" ]; then
            SUBMODULES="[]"
          fi

          COMPACT_SUBMODULES=$(echo "$SUBMODULES" | jq -c '.')
          echo "submodules=$COMPACT_SUBMODULES" >> $GITHUB_OUTPUT

          if [ "$COMPACT_SUBMODULES" = "[]" ]; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Output detected submodules
        run: |
          echo "Changed directories: ${{ steps.detect.outputs.changed-directories }}"
          echo "Submodules to test: ${{ steps.check.outputs.submodules }}"
          echo "Has changes: ${{ steps.check.outputs.has-changes }}"

  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        submodule: ${{ fromJSON(needs.detect-changes.outputs.submodules) }}
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: |
          pip install --upgrade pip
          pip install hatch

      - name: Run tests for ${{ matrix.submodule }}
        run: |
          echo "Running tests for ${{ matrix.submodule }}"
          hatch run test-${{ matrix.submodule }}:test

  test-all:
    needs: detect-changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: |
          pip install --upgrade pip
          pip install hatch

      - name: Run all tests
        run: |
          echo "Running MCAP tests..."
          hatch run test-mcap:test || true

          echo "Running MQTT tests..."
          hatch run test-mqtt:test || true

          echo "Running ZipDCM tests..."
          hatch run test-zipdcm:test || true

  test-summary:
    needs: [detect-changes, test, test-all]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check test results
        run: |
          echo "Test workflow completed"
          echo "Changes detected: ${{ needs.detect-changes.outputs.has-changes }}"
          echo "Submodules tested: ${{ needs.detect-changes.outputs.submodules }}"

          if [ "${{ needs.test.result }}" = "failure" ] || [ "${{ needs.test-all.result }}" = "failure" ]; then
            echo "Some tests failed!"
            exit 1
          else
            echo "All tests passed!"
          fi
