name: Test Release

on:
  push:
    branches:
      - 'build_tooling'
      - '!main'
  workflow_dispatch:

jobs:
  test-release:
    runs-on: ubuntu-latest
    environment: test-release
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.11.2"

      - name: Generate dev version
        id: version
        run: |
          BASE_VERSION=$(grep '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          DEV_VERSION="${BASE_VERSION}.dev${TIMESTAMP}"
          echo "version=$DEV_VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $DEV_VERSION"
          sed -i "s/version = \"${BASE_VERSION}\"/version = \"${DEV_VERSION}\"/" pyproject.toml

      - name: Build wheels
        run: uv build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          print-hash: true

      - name: Test installation from TestPyPI
        run: |
          sleep 180
          uv pip install --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              python-data-sources==${{ steps.version.outputs.version }}
          uv run python -c "import python_data_sources; print('Import successful!')"
