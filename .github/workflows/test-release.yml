name: Test Release

on:
  push:
    branches:
      - 'build_tooling'
      - '!main'
  workflow_dispatch:      # Allow manual trigger

jobs:
  test-release:
    runs-on: ubuntu-latest
    environment: test-release
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          cache: 'pip'
          cache-dependency-path: '**/pyproject.toml'
          python-version: '3.12'
      - name: Generate dev version
        id: version
        run: |
          BASE_VERSION=$(grep '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          DEV_VERSION="${BASE_VERSION}.dev${TIMESTAMP}"
          echo "version=$DEV_VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $DEV_VERSION"
          sed -i "s/version = \"${BASE_VERSION}\"/version = \"${DEV_VERSION}\"/" pyproject.toml
      - name: Build wheels
        run: |
          pip install hatch
          hatch build
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          print-hash: true
      - name: Test installation from TestPyPI
        run: |
          sleep 180
          pip install --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              python-data-sources==${{ steps.version.outputs.version }}
          python -c "import python_data_sources; print('Import successful!')"